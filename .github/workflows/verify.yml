name: Vérification PharmaShare
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  technical:
    name: Squelette technique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compiler et vérifier le démarrage Spring Boot
        run: sh mvnw -B -ntp -pl bootstrap -am test -Dtest=PharmaShareApplicationTest -Dsurefire.failIfNoSpecifiedTests=false
      - name: Conserver les rapports JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-techniques
          path: 'bootstrap/target/surefire-reports/'
          retention-days: 7
  domain:
    name: Exercices métier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Exécuter les tests du domaine
        run: sh mvnw -B -ntp -pl domain verify
      - name: Conserver les rapports JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-metier
          path: 'domain/target/surefire-reports/'
          retention-days: 7
